# Example routing. Replace the receiver with your pager, chat or mail integration. Critical alerts
# repeat every 30 minutes, warnings every 4 hours.
route:
  receiver: default
  group_by: [alertname]
  group_wait: 10s
  group_interval: 2m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: default
      repeat_interval: 30m
receivers:
  - name: default
    webhook_configs:
      - url: "http://127.0.0.1:9000/alert"   # placeholder: your webhook endpoint
        send_resolved: true
