[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamebond"
version = "0.3.4"
description = "Experimental two-path gaming tunnel"
requires-python = ">=3.11"
dependencies = ["cryptography>=46.0.7,<47"]

[project.optional-dependencies]
widget = ["psutil>=7.2.2,<8", "pystray>=0.19.5,<0.20", "Pillow>=12,<13", "PyQt5>=5.15.11,<6"]

[project.scripts]
gamebond = "gamebond.__main__:main"
gamebond-widget = "gamebond.glass_dashboard:main"

[tool.setuptools.packages.find]
include = ["gamebond*"]

[tool.setuptools.package-data]
"gamebond.admin" = ["static/*"]
